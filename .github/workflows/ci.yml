name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen
      # Contrats : le code généré doit correspondre aux contrats commités.
      - run: pnpm contracts:check
      - run: pnpm format:check
      # Lint, frontières d'architecture, types et tests des projets touchés et de ceux qui en dépendent.
      - run: pnpm nx affected -t lint typecheck test build --base=origin/main --outputStyle=static
        if: github.event_name == 'pull_request'
      - run: pnpm nx run-many -t lint typecheck test build --outputStyle=static
        if: github.event_name != 'pull_request'
