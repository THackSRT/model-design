openapi: 3.1.0
info:
  title: Service designs — modèles et patrons
  version: 1.0.0
  description: >
    Modèles, versions de modèle et spécifications de patron. Le service est le seul à écrire
    dans sa base ; il publie design.versioned à chaque nouvelle version. Il est aussi la porte des
    applications vers les moteurs de patronage et de fabrication, qu'elles n'appellent jamais
    directement (ADR 0001, 0012).
servers:
  - url: http://localhost:3101
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Le service répond.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/designs:
    post:
      operationId: createDesign
      summary: Créer un modèle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignRequest' }
      responses:
        '201':
          description: Modèle créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}:
    parameters:
      - $ref: '#/components/parameters/DesignId'
    get:
      operationId: getDesign
      summary: Lire un modèle
      responses:
        '200':
          description: Le modèle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions:
    parameters:
      - $ref: '#/components/parameters/DesignId'
    get:
      operationId: listDesignVersions
      summary: Lister les versions d'un modèle (résumés, la plus récente d'abord)
      description: >
        Résumés seulement : ni mesures ni patron (lire une version pour les obtenir). Ordre : numéro
        décroissant. Pagination par curseur : rappeler avec cursor = nextCursor tant que nextCursor est
        présent.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Une page de résumés de versions (vide si le modèle n'a pas encore de version).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersionPage' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createDesignVersion
      summary: Créer une version (calcule le patron)
      description: >
        Appelle le moteur de patronage avec les mesures et les paramètres, puis enregistre la
        version et sa spécification de patron. Mêmes entrées, même empreinte.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignVersionRequest' }
      responses:
        '201':
          description: Version créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/DraftingProblem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - name: versionNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDesignVersion
      summary: Lire une version
      description: >
        Mesures du client comprises : réservée à l'organisation propriétaire du modèle (404 sinon).
      responses:
        '200':
          description: La version et son patron.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersion' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/changes:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
      - name: since
        in: query
        required: true
        description: Numéro de la version de référence (avant ou après versionNumber).
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDesignVersionChanges
      summary: Comparer une version à une autre (paramètres et mesures)
      description: >
        Ce qui change des entrées entre la version since et la version versionNumber : paramètres du
        vêtement et mesures, valeurs telles qu'envoyées (sans appliquer les défauts). Les mesures du
        client n'y figurent que pour l'organisation propriétaire (404 sinon). La géométrie (pièces,
        aires, périmètres) n'est pas comparée ici : le client la compare depuis les spécifications des
        deux versions (ADR 0014).
      responses:
        '200':
          description: Les différences, triées par chemin de paramètre puis par nom de mesure.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersionChanges' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/cut-patterns:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: createVersionCutPattern
      summary: Calculer les pièces de coupe d'une version
      description: >
        Envoie la spécification de patron de la version au moteur de fabrication (ADR 0012) et rend ses
        pièces de coupe. Rien n'est enregistré : mêmes entrées, même version du moteur, même résultat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CutPatternOptions' }
      responses:
        '200':
          description: Les pièces de coupe (mm).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CutPattern' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ManufacturingProblem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/exports:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: createVersionExport
      summary: Exporter les pièces de coupe d'une version (SVG 1:1, PDF A4 tuilé, DXF-AAMA)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignExportRequest' }
      responses:
        '200':
          description: >
            Le fichier, dans le type de contenu du format demandé : image/svg+xml (svg),
            application/pdf (pdf-a4-tiled), image/vnd.dxf (dxf-aama). Type de contenu et nom de fichier
            sont fixés par le service, jamais recopiés de la réponse du moteur.
          headers:
            Content-Disposition:
              description: >
                attachment; filename="<garmentType>-v<versionNumber>[-<sizeLabel>].<svg|pdf|dxf>", où
                sizeLabel est réduit à [a-z0-9-] ; jamais de nom de modèle ni de client.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            image/svg+xml:
              schema: { type: string }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/vnd.dxf:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ManufacturingProblem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/drapes:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: createVersionDrape
      summary: Demander le drapé d'une version (tâche asynchrone)
      description: >
        Enregistre un drapé pending et écrit drape.requested dans l'outbox, dans la même transaction
        (ADR 0013) ; le calcul prend 5 à 60 s. Même demande canonique (empreinte SHA-256) sur la même
        version : le drapé existant est rendu (200), sauf s'il a échoué. Suivre l'état par
        GET …/drapes/{drapeId}.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DrapeRequest' }
      responses:
        '200':
          description: Drapé existant pour la même demande (pending ou completed).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Drape' }
        '202':
          description: Drapé demandé, pending.
          headers:
            Location:
              description: Chemin du drapé (GET …/drapes/{drapeId}).
              schema: { type: string, maxLength: 200 }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Drape' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/drapes/{drapeId}:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
      - $ref: '#/components/parameters/DrapeId'
    get:
      operationId: getVersionDrape
      summary: Lire l'état d'un drapé
      description: >
        Réservé à l'organisation propriétaire du modèle (404 sinon). Le studio interroge toutes les 2 s
        tant que status vaut pending. Types d'erreur stables d'un drapé failed (problemType) :
        /problems/drape-placement-missing, /problems/drape-placement-failed,
        /problems/drape-seam-not-closed, /problems/drape-body-penetration, /problems/drape-too-large,
        /problems/drape-internal (relayés de drape.failed), /problems/drape-timeout (encore pending 10
        minutes après createdAt).
      responses:
        '200':
          description: Le drapé.
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Drape' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/drapes/{drapeId}/model:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
      - $ref: '#/components/parameters/DrapeId'
    get:
      operationId: getVersionDrapeModel
      summary: Lire le modèle 3D d'un drapé (glTF 2.0 binaire, vêtement seul)
      description: >
        Lu dans le seau privé par le service, après vérification de l'organisation (404 sinon) ; jamais
        d'URL publique. Le fichier révèle la silhouette du client. Positions en mètres (unité imposée
        par glTF).
      responses:
        '200':
          description: Le modèle glTF 2.0 binaire.
          headers:
            Cache-Control:
              schema: { type: string, enum: ['private, no-store'] }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            model/gltf-binary:
              schema: { type: string, contentMediaType: model/gltf-binary }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: >
            /problems/drape-not-completed (RFC 9457) : le drapé est pending ou failed, aucun modèle à lire.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '502':
          description: >
            /problems/storage-unavailable (RFC 9457) : stockage objet injoignable ou objet absent.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  parameters:
    DesignId:
      name: designId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DrapeId:
      name: drapeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      required: false
      description: Nombre de résumés par page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Curseur opaque rendu par la page précédente (nextCursor). Absent : première page.'
      schema: { type: string, minLength: 1, maxLength: 64 }
  headers:
    NoStore:
      description: >
        Pièces et fichiers dérivés des mesures d'un client : jamais gardés par le navigateur ni par un
        intermédiaire.
      schema: { type: string, enum: [no-store] }
  responses:
    Problem:
      description: >
        Erreur au format RFC 9457. 502 /problems/engine-unavailable : moteur injoignable, trop lent
        (délai dépassé), réponse hors contrat ou requête refusée par sa validation. Types stables des
        drapés : voir getVersionDrape (dont /problems/drape-timeout) et getVersionDrapeModel.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DraftingProblem:
      description: >
        Version impossible à créer, au format RFC 9457. /problems/garment-type-mismatch : le type de
        vêtement demandé n'est pas celui du modèle. Sinon, le service relaie le type stable du moteur de
        patronage (contracts/openapi/patterning.yaml), seulement s'il est dans cette liste :
        /problems/measurement-required, /problems/inconsistent-measurements,
        /problems/garment-type-not-supported, /problems/skirt-shorter-than-hip-depth,
        /problems/trousers-shorter-than-crotch, /problems/trousers-hem-too-narrow,
        /problems/neckline-too-deep, /problems/sleeve-shorter-than-cap ; le détail est relayé (il ne
        contient jamais de mesure). Un autre type /problems/… du moteur devient
        /problems/pattern-impossible, avec un détail fixé par le service. Une erreur de validation du
        moteur (422 sans type /problems/…), un délai dépassé ou une réponse hors contrat deviennent 502
        /problems/engine-unavailable ; leur corps n'est ni relayé ni journalisé.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ManufacturingProblem:
      description: >
        Pièces impossibles à finir avec ces options, au format RFC 9457. Le service relaie le type
        stable du moteur de fabrication (contracts/openapi/manufacturing.yaml), seulement s'il est dans
        cette liste : /problems/unknown-edge, /problems/allowance-on-fold, /problems/allowance-on-dart,
        /problems/adjacent-darts, /problems/notch-outside-edge, /problems/open-contour,
        /problems/fold-edge-missing, /problems/cut-line-self-intersects,
        /problems/export-format-unavailable. Tout autre type, ou une erreur de validation du moteur,
        devient 502 /problems/engine-unavailable. Le détail est relayé ; il ne contient jamais de mesure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Identifiant stable, ex. /problems/design-not-found' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    CreateDesignRequest:
      $ref: '../schemas/designs/create-design-request.schema.json'
    Design:
      $ref: '../schemas/designs/design.schema.json'
    CreateDesignVersionRequest:
      $ref: '../schemas/designs/create-design-version-request.schema.json'
    DesignVersion:
      $ref: '../schemas/designs/design-version.schema.json'
    DesignVersionSummary:
      $ref: '../schemas/designs/design-version-summary.schema.json'
    DesignVersionPage:
      $ref: '../schemas/designs/design-version-page.schema.json'
    DesignVersionChanges:
      $ref: '../schemas/designs/design-version-changes.schema.json'
    CutPatternOptions:
      $ref: '../schemas/designs/cut-pattern-options.schema.json'
    DesignExportRequest:
      $ref: '../schemas/designs/design-export-request.schema.json'
    CutPattern:
      $ref: '../schemas/manufacturing/cut-pattern.schema.json'
    DrapeRequest:
      $ref: '../schemas/designs/drape-request.schema.json'
    Drape:
      $ref: '../schemas/designs/drape.schema.json'
