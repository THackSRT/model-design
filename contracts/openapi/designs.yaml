openapi: 3.1.0
info:
  title: Service designs — modèles et patrons
  version: 1.0.0
  description: >
    Modèles, versions de modèle et spécifications de patron. Le service est le seul à écrire
    dans sa base ; il publie design.versioned à chaque nouvelle version. Il est aussi la porte des
    applications vers les moteurs de patronage et de fabrication, qu'elles n'appellent jamais
    directement (ADR 0001, 0012).
servers:
  - url: http://localhost:3101
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Le service répond.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /v1/designs:
    post:
      operationId: createDesign
      summary: Créer un modèle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignRequest' }
      responses:
        '201':
          description: Modèle créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}:
    parameters:
      - $ref: '#/components/parameters/DesignId'
    get:
      operationId: getDesign
      summary: Lire un modèle
      responses:
        '200':
          description: Le modèle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Design' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions:
    parameters:
      - $ref: '#/components/parameters/DesignId'
    post:
      operationId: createDesignVersion
      summary: Créer une version (calcule le patron)
      description: >
        Appelle le moteur de patronage avec les mesures et les paramètres, puis enregistre la
        version et sa spécification de patron. Mêmes entrées, même empreinte.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesignVersionRequest' }
      responses:
        '201':
          description: Version créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersion' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - name: versionNumber
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getDesignVersion
      summary: Lire une version
      responses:
        '200':
          description: La version et son patron.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DesignVersion' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/cut-patterns:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: createVersionCutPattern
      summary: Calculer les pièces de coupe d'une version
      description: >
        Envoie la spécification de patron de la version au moteur de fabrication (ADR 0012) et rend ses
        pièces de coupe. Rien n'est enregistré : mêmes entrées, même version du moteur, même résultat.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CutPatternOptions' }
      responses:
        '200':
          description: Les pièces de coupe (mm).
          headers:
            Cache-Control: { $ref: '#/components/headers/NoStore' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CutPattern' }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ManufacturingProblem' }
        '502': { $ref: '#/components/responses/Problem' }
  /v1/designs/{designId}/versions/{versionNumber}/exports:
    parameters:
      - $ref: '#/components/parameters/DesignId'
      - $ref: '#/components/parameters/VersionNumber'
    post:
      operationId: createVersionExport
      summary: Exporter les pièces de coupe d'une version (SVG 1:1, PDF A4 tuilé, DXF-AAMA)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignExportRequest' }
      responses:
        '200':
          description: >
            Le fichier, dans le type de contenu du format demandé : image/svg+xml (svg),
            application/pdf (pdf-a4-tiled), image/vnd.dxf (dxf-aama). Type de contenu et nom de fichier
            sont fixés par le service, jamais recopiés de la réponse du moteur.
          headers:
            Content-Disposition:
              description: >
                attachment; filename="<garmentType>-v<versionNumber>[-<sizeLabel>].<svg|pdf|dxf>", où
                sizeLabel est réduit à [a-z0-9-] ; jamais de nom de modèle ni de client.
              schema: { type: string }
            Cache-Control: { $ref: '#/components/headers/NoStore' }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
          content:
            image/svg+xml:
              schema: { type: string }
            application/pdf:
              schema: { type: string, contentMediaType: application/pdf }
            image/vnd.dxf:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/ManufacturingProblem' }
        '502': { $ref: '#/components/responses/Problem' }
components:
  parameters:
    DesignId:
      name: designId
      in: path
      required: true
      schema: { type: string, format: uuid }
    VersionNumber:
      name: versionNumber
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  headers:
    NoStore:
      description: >
        Pièces et fichiers dérivés des mesures d'un client : jamais gardés par le navigateur ni par un
        intermédiaire.
      schema: { type: string, enum: [no-store] }
  responses:
    Problem:
      description: >
        Erreur au format RFC 9457. 502 /problems/engine-unavailable : moteur injoignable, trop lent
        (délai dépassé), réponse hors contrat ou requête refusée par sa validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ManufacturingProblem:
      description: >
        Pièces impossibles à finir avec ces options, au format RFC 9457. Le service relaie le type
        stable du moteur de fabrication (contracts/openapi/manufacturing.yaml), seulement s'il est dans
        cette liste : /problems/unknown-edge, /problems/allowance-on-fold, /problems/allowance-on-dart,
        /problems/adjacent-darts, /problems/notch-outside-edge, /problems/open-contour,
        /problems/fold-edge-missing, /problems/cut-line-self-intersects,
        /problems/export-format-unavailable. Tout autre type, ou une erreur de validation du moteur,
        devient 502 /problems/engine-unavailable. Le détail est relayé ; il ne contient jamais de mesure.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Identifiant stable, ex. /problems/design-not-found' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    CreateDesignRequest:
      $ref: '../schemas/designs/create-design-request.schema.json'
    Design:
      $ref: '../schemas/designs/design.schema.json'
    CreateDesignVersionRequest:
      $ref: '../schemas/designs/create-design-version-request.schema.json'
    DesignVersion:
      $ref: '../schemas/designs/design-version.schema.json'
    CutPatternOptions:
      $ref: '../schemas/designs/cut-pattern-options.schema.json'
    DesignExportRequest:
      $ref: '../schemas/designs/design-export-request.schema.json'
    CutPattern:
      $ref: '../schemas/manufacturing/cut-pattern.schema.json'
