openapi: 3.1.0
info:
  title: Moteur de patronage
  version: 1.0.0
  description: >
    Moteur sans état : des mesures et des paramètres en entrée, une spécification de patron en
    sortie. Déterministe : mêmes entrées, même version, même résultat.
servers:
  - url: http://localhost:3201
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Le moteur répond.
          content:
            application/json:
              schema:
                type: object
                required: [status, engineVersion]
                properties:
                  status: { type: string, enum: [ok] }
                  engineVersion: { type: string }
  /v1/patterns:
    post:
      operationId: draftPattern
      summary: Calculer un patron
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftPatternRequest' }
      responses:
        '200':
          description: La spécification de patron.
          content:
            application/json:
              schema: { $ref: '../schemas/garment-spec.schema.json' }
        '422': { $ref: '#/components/responses/DraftingProblem' }
components:
  responses:
    DraftingProblem:
      description: >
        Entrées valides mais impossibles à tracer, au format RFC 9457. Types stables :
        /problems/measurement-required (mesure obligatoire absente pour ce vêtement ; le détail cite le
        champ, jamais sa valeur), /problems/inconsistent-measurements (mesures données et estimées
        incohérentes entre elles), /problems/garment-type-not-supported (type de vêtement pas encore
        tracé par cette version du moteur), /problems/skirt-shorter-than-hip-depth (jupe droite plus
        courte que la ligne des hanches), /problems/trousers-shorter-than-crotch (pantalon trop court
        sous l'entrejambe), /problems/trousers-hem-too-narrow (tour d'ourlet trop petit pour la jambe),
        /problems/neckline-too-deep (encolure creusée sous la ligne de poitrine ou sous l'aisselle),
        /problems/sleeve-shorter-than-cap (manche plus courte que sa tête), /problems/curve-tangents-parallel
        et /problems/curve-tangents-diverge (courbe impossible à construire avec ces valeurs). Le détail
        ne contient jamais de valeur de mesure. Un nouveau type est un ajout compatible ; un type ne
        change jamais de sens. Une requête hors schéma reçoit le problème
        /problems/invalid-request (InvalidRequestProblem : chemins et contraintes, jamais les valeurs reçues).
      content:
        application/problem+json:
          schema:
            anyOf:
              - { $ref: '#/components/schemas/Problem' }
              - { $ref: '#/components/schemas/InvalidRequestProblem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, description: 'Identifiant stable, ex. /problems/neckline-too-deep' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    InvalidRequestProblem:
      description: >
        Requête hors schéma (RFC 9457), rendue par le kit des moteurs (py/engine-kit) : type
        /problems/invalid-request, statut 422. errors liste au plus 20 violations ; detail en donne le
        nombre total. Aucune entrée ne recopie la valeur reçue (mesures de client).
      allOf:
        - { $ref: '#/components/schemas/Problem' }
        - type: object
          required: [type, status, errors]
          properties:
            type: { const: /problems/invalid-request }
            status: { const: 422 }
            errors:
              type: array
              maxItems: 20
              items: { $ref: '#/components/schemas/ValidationError' }
    ValidationError:
      type: object
      additionalProperties: false
      required: [path, constraint]
      properties:
        path:
          type: string
          description: >
            Chemin JSON de la valeur fautive dans le corps, sans préfixe body (ex. panels[0].edges[2].from[1],
            measurements.waistGirthMm) ; $ pour le corps entier.
        constraint:
          type: string
          description: >
            Type de contrainte violée, celui de Pydantic (ex. missing, less_than_equal, extra_forbidden,
            literal_error). Jamais la valeur reçue.
    DraftPatternRequest:
      $ref: '../schemas/designs/create-design-version-request.schema.json'
