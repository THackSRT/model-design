# Documentation de la plateforme, construite en local : pnpm docs:serve · pnpm docs:build
site_name: Atelier — documentation
site_description: Plateforme de confection sur mesure — architecture, directives, plateforme, suivi.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: brown
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Mode clair

plugins:
  - search:
      lang: fr

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  # Inclusion de fichiers du dépôt (AGENTS.md, CHANGELOG.md, schémas) : une seule source, jamais de copie.
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

