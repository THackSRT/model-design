# Studio + passerelle locale. En production, la passerelle d'API (architecture, section 10) prend ce rôle.
server {
  listen 8080;
  root /usr/share/nginx/html;

  # Résolution DNS à la demande (DNS de Docker) : nginx démarre même si un service n'est pas encore prêt.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $designs http://designs:3101;

  location /api/designs/ {
    rewrite ^/api/designs/(.*)$ /$1 break;
    proxy_pass $designs;
    proxy_set_header X-Request-Id $request_id;
  }

  # Fichiers produits par Vite (noms avec empreinte) : cache long. Les données du mannequin (.mhz) sortent en
  # application/octet-stream, type par défaut de nginx, sans compression en route (gzip désactivé).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
