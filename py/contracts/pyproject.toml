[project]
name = "atelier-contracts"
version = "0.1.0"
description = "Modèles Pydantic générés depuis contracts/ (ne pas modifier à la main)."
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atelier_contracts"
